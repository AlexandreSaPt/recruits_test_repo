name: Build Cross-Platform Executables

on:
  workflow_dispatch:  # Allows manual triggers from GitHub UI
  push:
    tags:
      - 'v*'          # Triggers automatically when pushing a tag like v1.0.0

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: vm_server-linux
            executable_output: vm_server-linux

          - os: windows-latest
            artifact_name: vm_server-windows.exe
            executable_output: vm_server-windows.exe

          - os: macos-latest
            artifact_name: vm_server-macos
            executable_output: vm_server-macos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev patchelf ccache

      - name: Install Python Dependencies & Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          # Install dependencies specifically from inside the python_code folder
          pip install -r python_code/requirements.txt

      - name: Compile with Nuitka (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --lto=yes \
            --python-flag=no_docstrings \
            --output-filename=${{ matrix.executable_output }} \
            python_code/vm_server.py

      - name: Compile with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --assume-yes-for-downloads `
            --lto=yes `
            --python-flag=no_docstrings `
            --output-filename=${{ matrix.executable_output }} `
            python_code/vm_server.py

      - name: Upload Compiled Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.executable_output }}